<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved Materials | StudyShare</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header-row">
        <h2>My Saved Materials</h2>
        <a href="/dashboard.html">Dashboard</a>
      </div>
      <div id="saved" class="list"></div>
    </div>
    <script>
      const token = localStorage.getItem('token');
      async function loadSaved() {
        if (!token) {
          window.location.href = '/login.html';
          return;
        }
        const response = await fetch('/api/saved', { headers: { Authorization: `Bearer ${token}` } });
        const data = await response.json();
        const saved = document.getElementById('saved');
        saved.innerHTML = (data.materials || []).map((material) => `
          <div class="resource-item">
            <h4>${material.title}</h4>
            <div class="small">${material.university} • ${material.course} • ${material.module_code}</div>
            <div class="inline-actions">
              <a href="/material.html?id=${material.material_id}">View</a>
            </div>
          </div>
        `).join('');
      }
      loadSaved();
    </script>
  </body>
</html>
